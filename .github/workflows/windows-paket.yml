# Baut "ScanBook-Windows.zip": ScanBook mit portablem Python,
# laeuft auf jedem Windows-PC ohne Installation.
name: Windows-Paket

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12.10"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Portables Python herunterladen
        shell: pwsh
        run: |
          $ver = $env:PYTHON_VERSION
          New-Item -ItemType Directory -Force -Path paket\ScanBook | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile python.zip
          Expand-Archive python.zip -DestinationPath paket\ScanBook\python
          # Den ScanBook-Ordner (eine Ebene hoeher) in den Suchpfad aufnehmen,
          # damit ScanBook_Web.py das Modul ScanBook findet.
          $pth = Get-ChildItem paket\ScanBook\python\python*._pth | Select-Object -First 1
          Add-Content $pth.FullName ".."

      - name: ScanBook-Dateien kopieren
        shell: pwsh
        run: |
          Copy-Item ScanBook.py, ScanBook_Web.py, "ScanBook starten.bat", README.md paket\ScanBook\

      - name: Testlauf
        shell: pwsh
        run: |
          # In einer Kopie testen, damit keine Datenbank im Paket landet.
          Copy-Item paket\ScanBook test -Recurse
          $p = Start-Process test\python\python.exe -ArgumentList "ScanBook_Web.py", "--no-browser" -WorkingDirectory test -PassThru
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "ScanBook-Oberflaeche hat nicht geantwortet." }
          Write-Host "ScanBook laeuft mit dem portablen Python."

      - name: ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path paket\ScanBook -DestinationPath ScanBook-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScanBook-Windows
          path: ScanBook-Windows.zip

      - name: An Release anhaengen
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ScanBook-Windows.zip --clobber -R "${{ github.repository }}"
